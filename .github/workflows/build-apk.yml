name: Build HimRakshak APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files
        run: flutter create --platforms=android .

      - name: Add Internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permission = '    <uses-permission android:name="android.permission.INTERNET"/>\n'

          if 'android.permission.INTERNET' not in text:
              start = text.find('<manifest')
              end = text.find('>', start)

              if start == -1 or end == -1:
                  raise RuntimeError("Could not find <manifest> opening tag")

              text = text[:end + 1] + '\n' + permission + text[end + 1:]

          manifest.write_text(text)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HimRakshak-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
