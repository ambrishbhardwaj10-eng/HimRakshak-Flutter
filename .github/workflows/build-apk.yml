name: Build HimRakshak APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files
        run: |
          flutter create --platforms=android .
          rm -rf test

      - name: Configure Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.INTERNET"/>',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>',
          ]

          start = text.find("<manifest")
          end = text.find(">", start)

          if start == -1 or end == -1:
              raise RuntimeError(
                  "Manifest opening tag not found"
              )

          missing = []

          for permission in permissions:
              permission_name = permission.split('"')[1]

              if permission_name not in text:
                  missing.append(permission)

          if missing:
              insert = (
                  "\n"
                  + "\n".join(
                      " " + item
                      for item in missing
                  )
                  + "\n"
              )

              text = (
                  text[:end + 1]
                  + insert
                  + text[end + 1:]
              )

          manifest.write_text(text)

          kts = Path(
              "android/app/build.gradle.kts"
          )

          if not kts.exists():
              raise RuntimeError(
                  "build.gradle.kts not found"
              )

          gradle = kts.read_text()

          gradle = re.sub(
              r"compileSdk\s*=\s*flutter\.compileSdkVersion",
              "compileSdk = 36",
              gradle,
              count=1,
          )

          if (
              "isCoreLibraryDesugaringEnabled"
              not in gradle
          ):
              gradle = gradle.replace(
                  "compileOptions {",
                  "compileOptions {\n"
                  " "
                  "isCoreLibraryDesugaringEnabled = true",
                  1,
              )

          if "multiDexEnabled = true" not in gradle:
              gradle = gradle.replace(
                  "defaultConfig {",
                  "defaultConfig {\n"
                  " multiDexEnabled = true",
                  1,
              )

          dependency = (
              'coreLibraryDesugaring('
              '"com.android.tools:desugar_jdk_libs:2.1.4"'
              ')'
          )

          if dependency not in gradle:
              gradle += (
                  "\n\ndependencies {\n"
                  f" {dependency}\n"
                  "}\n"
              )

          kts.write_text(gradle)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          IMD_AUTH_HEADER_NAME: ${{ secrets.IMD_AUTH_HEADER_NAME }}
          IMD_AUTH_HEADER_VALUE: ${{ secrets.IMD_AUTH_HEADER_VALUE }}
        run: |
          flutter build apk --release \
            --dart-define=MAPBOX_ACCESS_TOKEN="$MAPBOX_ACCESS_TOKEN" \
            --dart-define=IMD_AUTH_HEADER_NAME="$IMD_AUTH_HEADER_NAME" \
            --dart-define=IMD_AUTH_HEADER_VALUE="$IMD_AUTH_HEADER_VALUE"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HimRakshak-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
